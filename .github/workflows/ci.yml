name: Multilingual Guide CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: mg_test_ci
          POSTGRES_USER: acceptance
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U acceptance -d mg_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: CongNghePhanMem/backend
    env:
      APP_ENV: test
      SECRET_KEY: isolated-ci-signing-key-never-use-in-production
      ADMIN_USER_IDS: ''
      TEST_POSTGRES: ${{ matrix.database == 'postgres' && '1' || '0' }}
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://acceptance:isolated-ci-password@127.0.0.1:5432/mg_test_ci' || 'sqlite:///./ci-test.db' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            CongNghePhanMem/backend/requirements*.txt
            CongNghePhanMem/backend/constraints.txt
      - run: pip install -r requirements-dev.txt
      - name: Run unit, API, migration and concurrency tests
        run: python -m pytest -q -p no:cacheprovider --junitxml=../test-results/backend-${{ matrix.database }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-${{ matrix.database }}-results
          path: CongNghePhanMem/test-results/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CongNghePhanMem/multilingual-guide
    env:
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: CongNghePhanMem/multilingual-guide/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint -- --no-cache
      - run: npm test
      - run: npm run build:web
      - run: npm run build:android
      - run: npm run build:ios

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: acceptance
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U acceptance -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: CongNghePhanMem/multilingual-guide/package-lock.json
      - run: pip install -r CongNghePhanMem/backend/requirements-dev.txt
      - run: npm ci --no-audit --no-fund
        working-directory: CongNghePhanMem/multilingual-guide
      - run: npx playwright install --with-deps chrome
        working-directory: CongNghePhanMem/multilingual-guide
      - name: E2E with real migrated PostgreSQL backend
        run: python -m scripts.verify_postgres --e2e
        working-directory: CongNghePhanMem/backend
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://acceptance:isolated-ci-password@127.0.0.1:5432/postgres
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            CongNghePhanMem/multilingual-guide/test-results/
            CongNghePhanMem/multilingual-guide/playwright-report/
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t multilingual-guide-backend:ci CongNghePhanMem/backend

  backend-image:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend, e2e, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested backend version
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/backend"
          version="${GITHUB_REF_NAME#v}"
          docker build -t "$image:$version" CongNghePhanMem/backend
          docker push "$image:$version"
